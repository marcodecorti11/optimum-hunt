<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Optimum Hunt</title>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: one app, two faces. Projector view = map left, controls right; phone view = one column card. Palette and type follow the DoE talk deck. */
:root{
  --bg:#FDFCF9; --surface:#F7F4EC; --raised:#FFFFFF; --ink:#0E3B34; --text:#4B5450; --muted:#6B746F;
  --green:#2F6B5F; --accent:#C4763A; --accent-ink:#A5561F; --rule:#D9D2C1; --rule-strong:#0E3B34;
  --good:#2F6B5F; --bad:#B4462F; --on-ink:#F7F4EC;
  --c0:#F1ECDF; --c1:#8DB5A5; --c2:#0E3B34; --plot:#F7F4EC;
  --serif:Georgia,"Times New Roman",serif; --sans:Lato,"Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A17; --surface:#15251F; --raised:#1A2E27; --ink:#E6EFEA; --text:#C3CEC8; --muted:#8C9C95;
  --green:#82BBA8; --accent:#E2945C; --accent-ink:#F0A877; --rule:#2B423A; --rule-strong:#C3CEC8;
  --good:#82BBA8; --bad:#E58A72; --on-ink:#0E1A17;
  --c0:#1B2D27; --c1:#3E7A67; --c2:#C9EBDC; --plot:#15251F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A17; --surface:#15251F; --raised:#1A2E27; --ink:#E6EFEA; --text:#C3CEC8; --muted:#8C9C95;
  --green:#82BBA8; --accent:#E2945C; --accent-ink:#F0A877; --rule:#2B423A; --rule-strong:#C3CEC8;
  --good:#82BBA8; --bad:#E58A72; --on-ink:#0E1A17;
  --c0:#1B2D27; --c1:#3E7A67; --c2:#C9EBDC; --plot:#15251F; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.wrap{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-block:16px 32px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 14px;border-bottom:2px solid var(--rule-strong)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand b{font-family:var(--serif);font-weight:400;font-size:22px;color:var(--ink)}
.brand span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border-radius:999px}
.tab{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;color:var(--muted);cursor:pointer}
.tab{white-space:nowrap}
@media (max-width:560px){.tabs{width:100%}.tab{flex:1;padding:6px 8px;font-size:13px}}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.live .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
.switch{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.switch:hover{color:var(--ink);border-color:var(--ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--on-ink);text-align:center}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.accent{background:var(--accent);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid currentColor}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* stage (projector) */
.stage-head{display:flex;flex-direction:column;gap:6px;max-width:70ch}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--accent-ink)}
.stage-head h1{font-size:clamp(30px,3.4vw,52px)}
.stage-head p{font-size:clamp(16px,1.35vw,21px)}
.stage-grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:900px){.stage-grid{grid-template-columns:minmax(0,1fr)}}
.mapbox{display:flex;flex-direction:column;gap:10px;min-width:0}
canvas.map{width:100%;display:block;border-radius:var(--radius);touch-action:manipulation}
canvas.map.clickable{cursor:crosshair}
.legend{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.ramp{width:160px;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--c0),var(--c1),var(--c2))}
.hint{font-size:14px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h3{font-size:22px}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--green)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 auto}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--mono);font-weight:500;font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
.board li:last-child{border-bottom:0}
.board .rk{font-family:var(--mono);color:var(--muted)}
.board .nm{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.board .vl{font-family:var(--mono);font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-style:italic}
.qr{background:#fff;border-radius:10px;padding:10px;width:min(240px,100%);aspect-ratio:1;display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.lobby{align-items:flex-start}
.lobby .qr{width:min(380px,100%)}
.lobby h2{font-size:clamp(26px,2.4vw,38px)}
.lobby .link{font-size:clamp(14px,1.2vw,18px)}
.link{font-family:var(--mono);font-size:13px;word-break:break-all;color:var(--ink);user-select:all}
.field{display:flex;flex-direction:column;gap:6px}
.field input{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--raised);font-family:var(--mono);font-size:13px;min-width:0}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names span{background:var(--raised);border:1px solid var(--rule);border-radius:999px;padding:4px 10px;font-size:14px;color:var(--ink)}
.toggles{display:flex;flex-direction:column;gap:8px}
.tog{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:10px;cursor:pointer;font-size:15px;color:var(--ink)}
.tog input{width:18px;height:18px;accent-color:var(--ink)}
.sw{width:22px;height:4px;border-radius:2px}
table.cmp{width:100%;border-collapse:collapse;font-size:15px}
table.cmp th{text-align:left;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 4px;border-bottom:1px solid var(--rule)}
table.cmp td{padding:8px 4px;border-bottom:1px solid var(--rule);vertical-align:baseline}
table.cmp td.n{font-family:var(--mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
table.cmp tr.hl td{color:var(--ink);font-weight:700}

/* quiz projector */
.qstage{display:flex;flex-direction:column;gap:24px}
.qtext{font-family:var(--serif);font-size:clamp(26px,3vw,46px);color:var(--ink);line-height:1.2;max-width:34ch;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:18px 20px;border-radius:var(--radius);background:var(--surface);border:2px solid transparent;overflow:hidden;font-size:clamp(17px,1.4vw,22px);color:var(--ink);text-align:left}
.opt .lt{font-family:var(--mono);font-weight:600;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;background:var(--raised);color:var(--ink);font-size:.85em}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--c1) 35%,transparent);z-index:0;transition:width .6s ease}
.opt > *:not(.bar){position:relative;z-index:1}
.opt .ct{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.opt.correct{border-color:var(--good)}
.opt.correct .lt{background:var(--good);color:var(--on-ink)}
.opt.wrong{opacity:.55}
.explain{background:var(--surface);border-left:4px solid var(--good);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;font-size:clamp(16px,1.25vw,20px);max-width:80ch;color:var(--ink)}
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qbar .sp{margin-right:auto}
.progress{display:flex;gap:6px}
.progress i{width:28px;height:6px;border-radius:3px;background:var(--rule)}
.progress i.on{background:var(--ink)}

/* phone card */
.phone{max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:26px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.steps i.done{background:var(--accent)}
.steps i.now{background:var(--ink)}
.slider{display:flex;flex-direction:column;gap:8px}
.slider .rd{display:flex;justify-content:space-between;align-items:baseline}
.slider .rd b{font-family:var(--mono);font-size:30px;color:var(--ink);font-weight:500}
.slider input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.fixed{font-size:15px;color:var(--ink);background:var(--raised);border-radius:8px;padding:8px 12px}
.runs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.runs li{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:10px;align-items:baseline;background:var(--raised);border-radius:8px;padding:8px 12px}
.runs .i{font-family:var(--mono);color:var(--muted);font-size:13px}
.runs .c{font-size:14px}
.runs .v{font-family:var(--mono);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.runs li.best{outline:2px solid var(--accent)}
.big{display:flex;align-items:baseline;gap:10px}
.big b{font-family:var(--mono);font-size:44px;font-weight:500;color:var(--ink);line-height:1}
.pick{display:grid;gap:10px}
.pick .opt{cursor:pointer;width:100%;background:var(--raised);border-color:var(--rule)}
.pick .opt[aria-pressed="true"]{border-color:var(--ink);background:var(--raised)}
.pick .opt:disabled{cursor:default}
.result{font-weight:700}
.result.ok{color:var(--good)}
.result.no{color:var(--bad)}
.wait{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.opt .bar{transition:none}}
.banner{background:var(--surface);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:20}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><span>Paradisi Research · DoE live</span><b>Optimum Hunt</b></div>
    <div class="tabs" id="tabs" role="group" aria-label="Exercise"></div>
    <span class="chip" id="status"><i class="dot"></i><span>Connecting…</span></span>
    <button class="switch" id="viewSwitch" hidden></button>
  </header>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>

<script>
(function(){
"use strict";
const JOIN_DEFAULT = /^https?:$/.test(location.protocol) ? location.origin + location.pathname.replace(/index\.html$/,"") : "";  /* the QR points at wherever this page is hosted */
const E=0.045;               /* breathing room so runs on the edge of the box stay visible */
const OFAT_T=115, OFAT_RUNS=3, FREE_RUNS=6, ENZ_RUNS=4;

/* ---------- two toy reactions ("worlds") ---------- */
function truthAcid(x,y){ const s=(x+y)/2, d=x-y; return 8 + 6*x + 76*Math.exp(-d*d/(2*0.12*0.12))*Math.exp(-((s-0.85)**2)/(2*0.3*0.3)); }
/* enzyme in flow: too short = not converted; too hot or too long = enzyme loses activity. Best T falls as residence time grows. */
function truthEnz(x,y){ return 4 + 84*Math.exp(-((y-(0.95-0.75*x))**2)/(2*0.13*0.13))*Math.exp(-((x-0.7)**2)/(2*0.3*0.3)); }
const W1={key:"acid",ls:0.2,truth:truthAcid,x0:0.1,x1:3.0,xs:0.1,y0:100,y1:160,ys:5,xName:"Acid (eq)",yName:"Temperature (°C)",
  xTicks:[0.1,0.5,1.0,1.5,2.0,2.5,3.0],yTicks:[100,110,120,130,140,150,160],xt:v=>v.toFixed(1),fx:v=>v.toFixed(1)+" eq",fy:v=>Math.round(v)+" °C"};
const W2={key:"enz",ls:0.15,truth:truthEnz,x0:1,x1:30,xs:1,y0:20,y1:70,ys:5,xName:"Residence time (min)",yName:"Temperature (°C)",
  xTicks:[1,5,10,15,20,25,30],yTicks:[20,30,40,50,60,70],xt:v=>String(v),fx:v=>Math.round(v)+" min",fy:v=>Math.round(v)+" °C"};
const ux=(W,x)=>W.x0+(W.x1-W.x0)*x, uy=(W,y)=>W.y0+(W.y1-W.y0)*y;      // coded -> units
const cx=(W,a)=>(a-W.x0)/(W.x1-W.x0), cy=(W,t)=>(t-W.y0)/(W.y1-W.y0);  // units -> coded
const fX=(W,x)=>W.fx(ux(W,x)), fY=(W,y)=>W.fy(uy(W,y));
const clamp01=v=>Math.min(1,Math.max(0,v));
const snapX=(W,x)=>cx(W,Math.round(ux(W,clamp01(x))/W.xs)*W.xs), snapY=(W,y)=>cy(W,Math.round(uy(W,clamp01(y))/W.ys)*W.ys);
function measure(W,x,y){ let n=0; for(let i=0;i<6;i++) n+=Math.random(); n=(n-3)*Math.SQRT2; return Math.max(0, Math.round((W.truth(x,y)+1.5*n)*10)/10); }
[W1,W2].forEach(W=>{ let b={x:0,y:0,v:-1}; for(let i=0;i<=300;i++) for(let j=0;j<=200;j++){ const x=i/300,y=j/200,v=W.truth(x,y); if(v>b.v) b={x,y,v}; } W.opt=b;
  W.grid=[]; for(let a=W.x0; a<=W.x1+1e-9; a+=W.xs) for(let t=W.y0; t<=W.y1+1e-9; t+=W.ys) W.grid.push({x:cx(W,Math.round(a*100)/100),y:cy(W,t)}); });
const fA=x=>fX(W1,x), fT=y=>fY(W1,y);

/* ---------- Gaussian process + expected improvement ---------- */
function phi(z){return Math.exp(-z*z/2)/Math.sqrt(2*Math.PI);}
function Phi(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p;}
function gpFit(P,ls){
  ls=ls||0.2; const n=P.length, ys=P.map(p=>p.v/100), mu=ys.reduce((a,b)=>a+b,0)/n;
  const sv=Math.max(0.02, ys.reduce((a,b)=>a+(b-mu)**2,0)/n);
  const K=(a,b)=>sv*Math.exp(-((a.x-b.x)**2+(a.y-b.y)**2)/(2*ls*ls));
  const L=P.map(()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<=i;j++){ let s=K(P[i],P[j])+(i===j?4e-4:0); for(let k=0;k<j;k++) s-=L[i][k]*L[j][k]; L[i][j]= i===j?Math.sqrt(Math.max(s,1e-12)):s/L[j][j]; }
  const fwd=b=>{const x=[];for(let i=0;i<n;i++){let s=b[i];for(let k=0;k<i;k++)s-=L[i][k]*x[k];x[i]=s/L[i][i];}return x;};
  const bwd=b=>{const x=[];for(let i=n-1;i>=0;i--){let s=b[i];for(let k=i+1;k<n;k++)s-=L[k][i]*x[k];x[i]=s/L[i][i];}return x;};
  const alpha=bwd(fwd(ys.map(y=>y-mu)));
  const f=(x,y)=>{ const q={x,y}, k=P.map(p=>K(p,q)); const m=mu+k.reduce((a,v,i)=>a+v*alpha[i],0); const v=fwd(k); const va=sv-v.reduce((a,b)=>a+b*b,0); return [m, Math.sqrt(Math.max(va,1e-10))]; };
  f.sd0=Math.sqrt(sv); return f;
}
function suggest(W,P){
  const gp=gpFit(P,W.ls), best=Math.max(...P.map(p=>p.v))/100; let pick=null, ei=-1;
  for(const c of W.grid){ if(P.some(p=>Math.abs(p.x-c.x)<1e-6&&Math.abs(p.y-c.y)<1e-6)) continue;
    const [m,s]=gp(c.x,c.y); const z=(m-best-0.01)/s, e=(m-best-0.01)*Phi(z)+s*phi(z); if(e>ei){ei=e;pick=c;} }
  return pick;
}
function bestOf(p){ return p.reduce((b,r)=>r.v>b.v?r:b, p[0]); }

/* ---------- reference strategies (noise-free) ---------- */
const REF=(()=>{
  const at=(W,a,t)=>{ const x=cx(W,a), y=cy(W,t); return {x,y,v:W.truth(x,y)}; };
  const s1=[0.5,1.0,1.5,2.0,2.5].map(a=>at(W1,a,OFAT_T)), b1=bestOf(s1);
  const s2=[100,130,145,160].map(t=>at(W1,ux(W1,b1.x),t));
  const fact=[at(W1,0.1,100),at(W1,3.0,100),at(W1,0.1,160),at(W1,3.0,160),at(W1,1.55,130)];
  const bo=[...fact]; for(let k=0;k<5;k++){ const p=suggest(W1,bo); bo.push({...p,v:W1.truth(p.x,p.y)}); }
  const start=[at(W2,1,20),at(W2,30,20),at(W2,1,70),at(W2,30,70),at(W2,15.5,45)].map(p=>({...p,v:Math.round(p.v*10)/10}));
  const bo2=[...start]; for(let k=0;k<ENZ_RUNS;k++){ const p=suggest(W2,bo2); bo2.push({...p,v:W2.truth(p.x,p.y)}); }
  return {ofat:[...s1,...s2], ofatPath:[...s1,b1,...s2], fact, bo:bo.slice(5), start, bo2:bo2.slice(5)};
})();

/* ---------- quiz ---------- */
const QUIZ = [
 {q:"One factor at a time stalled near 25 % yield, but the optimum is near 89 %. Why did it miss?",
  o:["Too few runs","The best acid amount depends on the temperature","Measurement noise","The ranges were too narrow"],c:1,
  e:"The high-yield region is a diagonal ridge: acid and temperature only pay off together. Holding T at 115 °C, the best acid is low, so OFAT never climbs the ridge. That is an interaction."},

/* ---------- boot ---------- */
function redraw(){ app.lastKey=""; render(true); }
window.addEventListener("resize",()=>{ clearTimeout(redraw._t); redraw._t=setTimeout(()=>document.querySelectorAll("canvas.map").forEach(cv=>cv._o&&drawMap(cv,cv._o)),120); });
try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redraw); }catch(e){}
new MutationObserver(redraw).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
async function boot(){
  render(true);
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user]=await Promise.all([use("db"),use("user")]);
  app.user=user;
  if(user){ try{ app.canEdit=await user.canEdit(); app.uid=await user.id(); }catch(e){} }
  if(!db){ app.mode="solo"; app.uid="me"; try{ app.narrow=matchMedia("(max-width: 700px)").matches; }catch(e){} app.state=defaultState(); loadLocal(); try{ const v=localStorage.getItem(LS+"-view"); if(v==="player"||v==="presenter") app.viewAs=v; }catch(e){} render(true); return; }
  app.db=db; app.mode="live"; render(true);
  db.doc("live/state").onSnapshot(snap=>{
    if(snap.exists){ app.state=snap.data(); app.stateMissing=false; }
    else if(app.canEdit){ if(!app.state){ app.state=defaultState(); } db.doc("live/state").set(app.state).catch(dbErr); app.stateMissing=false; }
    else app.stateMissing=true;
    reconcileJoin(); render();
  },()=>{ app.mode="solo"; if(!app.state) app.state=defaultState(); render(true); });
  db.collection("hunt").onSnapshot(qs=>{ const o={}; qs.docs.forEach(d=>{ if(d.exists) o[d.id]=d.data(); }); app.hunt=o; reconcileJoin(); render(); },()=>{});
  db.collection("quiz").onSnapshot(qs=>{ const o={}; qs.docs.forEach(d=>{ if(d.exists) o[d.id]=d.data(); }); app.quiz=o; render(); },()=>{});
}
document.fonts&&document.fonts.ready.then(()=>{ document.querySelectorAll("canvas.map").forEach(cv=>cv._o&&drawMap(cv,cv._o)); });
boot();
})();
